<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XOUL · 用户画像</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="profiles.css"></head>
<body>
<header class="topbar"><a class="brand" href="/admin.html">XOUL <span>STUDIO</span></a><nav class="catalog-nav"><a href="/admin.html">产品体验</a><a class="active" href="/profiles.html">用户画像</a></nav><div class="top-actions"><span class="local-badge">本地工作区</span><span class="saved" id="saveState">已保存</span></div></header>
<main class="content profiles-page"><div class="page-head"><div><p class="eyebrow">USER MEMORY</p><h2>用户画像</h2><p class="muted">管理 C 端已登录用户，并查看他们在各 Agent 下留下的输入记录。</p></div><div class="profile-actions"><button id="resetSeeds" class="ghost" type="button">恢复 3 个 Seed</button><button id="newProfile" class="primary" type="button">＋ 新建画像</button></div></div>
<div id="notice" class="notice" role="status" hidden></div><div class="profiles-layout"><section class="profiles-list-panel"><div class="profiles-list-head"><h3>画像列表</h3><span id="profileCount" class="muted"></span></div><div id="profilesList" class="profiles-list"></div></section><section id="editorPanel" class="profile-editor" hidden><div class="editor-heading"><div><p class="eyebrow" id="editorMode">编辑画像</p><h3 id="editorTitle"></h3></div><button id="cancelEdit" class="ghost" type="button">取消</button></div><form id="profileForm"><div class="form-grid"><label>显示名称<input id="profileName" required maxlength="40"></label><label>头像文字<input id="profileAvatar" required maxlength="2"></label><label class="wide">一句话标签<input id="profileHeadline" maxlength="80"></label><label class="wide">偏好（每行一项）<textarea id="profilePreferences" rows="3"></textarea></label><label class="wide">目标（每行一项）<textarea id="profileGoals" rows="3"></textarea></label><label class="wide">给 Agent 的注意事项<textarea id="profileNotes" rows="3"></textarea></label></div><label class="switch-line"><input id="profileEnabled" type="checkbox"><span>允许在 C 端切换</span></label><div class="profile-history-summary" id="historySummary"></div><div class="catalog-form-actions"><button id="deleteProfile" class="danger-button" type="button">删除画像</button><button class="primary" type="submit">保存画像</button></div></form></section></div></main>
<script src="api-base.js"></script><script src="user-profile-data.js"></script><script src="profiles.js"></script></body></html>

# XOUL hosted path mapping. Keep xoul.fortoken.vip on the legacy origin.
server {
    listen 127.0.0.1:6670;
    listen 172.31.0.3:6670;
    server_name xoul-origin-v2;

    root /var/www/xoul-v2;
    index index.html;

    location ~ ^/e/(.+\.(?:css|js|svg|png|jpe?g|webp))$ { rewrite ^/e/(.*)$ /$1 last; }
    location = /admin { try_files /admin.html =404; }
    location = /catalog { try_files /catalog.html =404; }
    location = /types { try_files /types.html =404; }
    location = /models { try_files /models.html =404; }
    location ~ ^/e/[^/]+$ { rewrite ^/e/[^/]+$ /public.html last; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xoul.teamaihub.com;

    ssl_certificate /etc/letsencrypt/live/xoul.teamaihub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xoul.teamaihub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:6670;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name xoul.teamaihub.com;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:6670;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:6670;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name xoul.fortoken.vip;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:6666;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:6666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
